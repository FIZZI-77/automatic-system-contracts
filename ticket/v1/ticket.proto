syntax = "proto3";

package ticket.v1;

option go_package = "github.com/FIZZI-77/automatic-system-contracts/gen/go/ticket/v1";

import "google/protobuf/timestamp.proto";

service TicketService {
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  rpc AttachRequest(AttachRequestRequest) returns (AttachRequestResponse);
  rpc DetachRequest(DetachRequestRequest) returns (DetachRequestResponse);
  rpc ListIncidentRequests(ListIncidentRequestsRequest) returns (ListIncidentRequestsResponse);
  rpc RegisterIntegration(RegisterIntegrationRequest) returns (RegisterIntegrationResponse);
  rpc CreateExternalRequest(CreateExternalRequestRequest) returns (CreateExternalRequestResponse);
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
  rpc UpdateTicket(UpdateTicketRequest) returns (UpdateTicketResponse);
  rpc ChangeTicketStatus(ChangeTicketStatusRequest) returns (ChangeTicketStatusResponse);
  rpc AssignBrigade(AssignBrigadeRequest) returns (AssignBrigadeResponse);
  rpc CancelTicket(CancelTicketRequest) returns (CancelTicketResponse);
  rpc CompleteTicket(CompleteTicketRequest) returns (CompleteTicketResponse);
  rpc GetTicketStatusHistory(GetTicketStatusHistoryRequest) returns (GetTicketStatusHistoryResponse);
  rpc CreateWorkReport(CreateWorkReportRequest) returns (CreateWorkReportResponse);
  rpc ListWorkReports(ListWorkReportsRequest) returns (ListWorkReportsResponse);
  rpc SubmitTicketFeedback(SubmitTicketFeedbackRequest) returns (SubmitTicketFeedbackResponse);
  rpc GetTicketFeedback(GetTicketFeedbackRequest) returns (GetTicketFeedbackResponse);

  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
}

message WorkReport {
  string id = 1;
  string ticket_id = 2;
  string author_user_id = 3;
  string description = 4;
  repeated string file_ids = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string completion_status = 8;
  string completion_file_id = 9;
  string completion_error = 10;
}

message CreateWorkReportRequest {
  string ticket_id = 1;
  string author_user_id = 2;
  string description = 3;
  repeated string file_ids = 4;
  string idempotency_key = 5;
  optional CompletionReportRequest completion = 6;
}

message CompletionReportRequest {
  string requested_by = 1;
  repeated string actor_roles = 2;
  string opened_by = 3;
  CompletionBrigade brigade = 4;
}

message CompletionBrigade {
  string id = 1;
  string name = 2;
  repeated CompletionBrigadeMember members = 3;
}

message CompletionBrigadeMember {
  string user_id = 1;
  string full_name = 2;
  string role = 3;
}

message CreateWorkReportResponse { WorkReport report = 1; }
message ListWorkReportsRequest { string ticket_id = 1; }
message ListWorkReportsResponse { repeated WorkReport reports = 1; }


enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_NEW = 1;
  TICKET_STATUS_ASSIGNED = 2;
  TICKET_STATUS_IN_PROGRESS = 3;
  TICKET_STATUS_DONE = 4;
  TICKET_STATUS_CANCELED = 5;
}

enum TicketPriority {
  TICKET_PRIORITY_UNSPECIFIED = 0;
  TICKET_PRIORITY_LOW = 1;
  TICKET_PRIORITY_MEDIUM = 2;
  TICKET_PRIORITY_HIGH = 3;
  TICKET_PRIORITY_EMERGENCY = 4;
}

enum TicketType {
  TICKET_TYPE_UNSPECIFIED = 0;
  TICKET_TYPE_INCIDENT = 1;
  TICKET_TYPE_REQUEST = 2;
}


message Ticket {
  string id = 1;

  string department_id = 2;
  string category_id = 3;

  string user_id = 4;
  string brigade_id = 5;

  string title = 6;
  string description = 7;

  TicketStatus status = 8;
  TicketPriority priority = 9;

  string address = 10;
  double latitude = 11;
  double longitude = 12;

  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;

  google.protobuf.Timestamp assigned_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp canceled_at = 17;
  optional string asset_id = 18;
  TicketType ticket_type = 19;
  optional string incident_id = 20;
  optional string external_system_id = 21;
  optional string external_id = 22;
}

message CreateRequestRequest {
  string department_id = 1;
  string category_id = 2;
  string user_id = 3;
  string title = 4;
  string description = 5;
  TicketPriority priority = 6;
  string address = 7;
  double latitude = 8;
  double longitude = 9;
  optional string asset_id = 10;
}

message CreateRequestResponse {
  Ticket request = 1;
  Ticket incident = 2;
  bool duplicate_matched = 3;
}

message AttachRequestRequest {
  string incident_id = 1;
  string request_id = 2;
  string reason = 3;
}

message AttachRequestResponse { Ticket request = 1; }

message DetachRequestRequest {
  string request_id = 1;
  string reason = 2;
}

message DetachRequestResponse { Ticket request = 1; }

message ListIncidentRequestsRequest {
  string incident_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListIncidentRequestsResponse {
  repeated Ticket requests = 1;
  int64 total = 2;
}

message TicketIntegration {
  string id = 1;
  string name = 2;
  string client_id = 3;
  string secret_prefix = 4;
  optional string allowed_department_id = 5;
  bool is_active = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp last_used_at = 10;
}

message RegisterIntegrationRequest {
  string name = 1;
  string client_id = 2;
  optional string allowed_department_id = 3;
}

message RegisterIntegrationResponse {
  TicketIntegration integration = 1;
  string secret = 2;
}

message CreateExternalRequestRequest {
  string client_id = 1;
  string secret = 2;
  string external_id = 3;
  string department_id = 4;
  string category_id = 5;
  string user_id = 6;
  string title = 7;
  string description = 8;
  TicketPriority priority = 9;
  string address = 10;
  double latitude = 11;
  double longitude = 12;
  optional string asset_id = 13;
}

message CreateExternalRequestResponse {
  Ticket request = 1;
  Ticket incident = 2;
  bool duplicate_matched = 3;
}

message TicketCategory {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TicketStatusHistory {
  string id = 1;
  string ticket_id = 2;

  TicketStatus old_status = 3;
  TicketStatus new_status = 4;

  string changed_by = 5;
  string comment = 6;

  google.protobuf.Timestamp created_at = 7;
}

message CreateTicketRequest {
  string department_id = 1;
  string category_id = 2;
  string user_id = 3;
  string title = 4;
  string description = 5;

  TicketPriority priority = 6;

  string address = 7;
  optional double latitude = 8;
  optional double longitude = 9;
  optional string asset_id = 10;
}

message CreateTicketResponse {
  Ticket ticket = 1;
}

message GetTicketRequest {
  string ticket_id = 1;
}

message GetTicketResponse {
  Ticket ticket = 1;
}

enum TicketSortBy {
  TICKET_SORT_BY_UNSPECIFIED = 0;
  TICKET_SORT_BY_CREATED_AT = 1;
  TICKET_SORT_BY_UPDATED_AT = 2;
  TICKET_SORT_BY_PRIORITY = 3;
  TICKET_SORT_BY_STATUS = 4;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message ListTicketsRequest {
  optional string department_id = 1;
  optional string user_id = 2;
  optional string brigade_id = 3;
  optional string category_id = 4;

  optional TicketStatus status = 5;
  optional TicketPriority priority = 6;

  google.protobuf.Timestamp created_from = 7;
  google.protobuf.Timestamp created_to = 8;

  int32 limit = 9;
  int32 offset = 10;

  optional TicketSortBy sort_by = 11;
  optional SortOrder sort_order = 12;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  int64 total = 2;
}

message UpdateTicketRequest {
  string ticket_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string category_id = 4;
  optional TicketPriority priority = 5;

  optional string address = 6;
  optional double latitude = 7;
  optional double longitude = 8;
  string updated_by = 9;
  optional string asset_id = 10;
}

message UpdateTicketResponse {
  Ticket ticket = 1;
}

message ChangeTicketStatusRequest {
  string ticket_id = 1;
  TicketStatus new_status = 2;
  string changed_by = 3;
  string comment = 4;
}

message ChangeTicketStatusResponse {
  Ticket ticket = 1;
}

message AssignBrigadeRequest {
  string ticket_id = 1;
  string brigade_id = 2;
  string assigned_by = 3;
  string comment = 4;
}

message AssignBrigadeResponse {
  Ticket ticket = 1;
}

message CancelTicketRequest {
  string ticket_id = 1;
  string canceled_by = 2;
  string reason = 3;
}

message CancelTicketResponse {
  Ticket ticket = 1;
}

message CompleteTicketRequest {
  string ticket_id = 1;
  string completed_by = 2;
  string comment = 3;
}

message CompleteTicketResponse {
  Ticket ticket = 1;
}

message GetTicketStatusHistoryRequest {
  string ticket_id = 1;

  int32 limit = 2;
  int32 offset = 3;
}

message GetTicketStatusHistoryResponse {
  repeated TicketStatusHistory history = 1;
  int64 total = 2;
}

message CreateCategoryRequest {
  string code = 1;
  string name = 2;
  string description = 3;
}

message CreateCategoryResponse {
  TicketCategory category = 1;
}

message GetCategoryRequest {
  string category_id = 1;
}

message GetCategoryResponse {
  TicketCategory category = 1;
}

message ListCategoriesRequest {
  optional bool only_active = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListCategoriesResponse {
  repeated TicketCategory categories = 1;
  int64 total = 2;
}

message UpdateCategoryRequest {
  string category_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional bool is_active = 4;
}

message UpdateCategoryResponse {
  TicketCategory category = 1;
}

message DeleteCategoryRequest {
  string category_id = 1;
}

message DeleteCategoryResponse {
  TicketCategory category = 1;
}

message TicketFeedback {
  string ticket_id = 1;
  string user_id = 2;
  uint32 rating = 3;
  bool problem_resolved = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message SubmitTicketFeedbackRequest {
  string ticket_id = 1;
  uint32 rating = 2;
  bool problem_resolved = 3;
  string comment = 4;
}
message SubmitTicketFeedbackResponse { TicketFeedback feedback = 1; }
message GetTicketFeedbackRequest { string ticket_id = 1; }
message GetTicketFeedbackResponse { TicketFeedback feedback = 1; }
