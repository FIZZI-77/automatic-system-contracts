syntax = "proto3";
package notification.v1;
option go_package = "github.com/FIZZI-77/automatic-system-contracts/gen/go/notification/v1";
import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkRead(MarkReadRequest) returns (NotificationResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (PreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (PreferencesResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (DeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeviceResponse);
  rpc UpsertTemplate(UpsertTemplateRequest) returns (TemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
}
enum Channel { CHANNEL_UNSPECIFIED=0; CHANNEL_IN_APP=1; CHANNEL_PUSH=2; CHANNEL_EMAIL=3; CHANNEL_SMS=4; }
enum DeliveryStatus { DELIVERY_STATUS_UNSPECIFIED=0; DELIVERY_STATUS_PENDING=1; DELIVERY_STATUS_PROCESSING=2; DELIVERY_STATUS_SENT=3; DELIVERY_STATUS_FAILED=4; DELIVERY_STATUS_DEAD=5; DELIVERY_STATUS_SKIPPED=6; }
message Notification { string id=1; string user_id=2; string event_type=3; string title=4; string body=5; map<string,string> data=6; bool read=7; optional google.protobuf.Timestamp read_at=8; google.protobuf.Timestamp created_at=9; }
message Preferences { string user_id=1; bool in_app_enabled=2; bool push_enabled=3; bool email_enabled=4; bool sms_enabled=5; optional string email=6; optional string phone=7; google.protobuf.Timestamp updated_at=8; }
message Device { string id=1; string user_id=2; string token=3; string platform=4; bool active=5; google.protobuf.Timestamp created_at=6; google.protobuf.Timestamp updated_at=7; }
message Template { string id=1; string event_type=2; Channel channel=3; string subject=4; string body=5; bool active=6; google.protobuf.Timestamp created_at=7; google.protobuf.Timestamp updated_at=8; }
message Delivery { string id=1; string notification_id=2; Channel channel=3; string recipient=4; DeliveryStatus status=5; int32 attempts=6; optional string provider_id=7; optional string last_error=8; google.protobuf.Timestamp next_attempt_at=9; google.protobuf.Timestamp created_at=10; google.protobuf.Timestamp updated_at=11; }
message ListNotificationsRequest { string user_id=1; optional bool unread_only=2; int32 limit=3; int32 offset=4; }
message ListNotificationsResponse { repeated Notification notifications=1; int64 total=2; int64 unread=3; }
message MarkReadRequest { string user_id=1; string notification_id=2; }
message NotificationResponse { Notification notification=1; }
message MarkAllReadRequest { string user_id=1; }
message MarkAllReadResponse { int64 updated=1; }
message GetPreferencesRequest { string user_id=1; }
message UpdatePreferencesRequest { string user_id=1; optional bool in_app_enabled=2; optional bool push_enabled=3; optional bool email_enabled=4; optional bool sms_enabled=5; optional string email=6; optional string phone=7; }
message PreferencesResponse { Preferences preferences=1; }
message RegisterDeviceRequest { string user_id=1; string token=2; string platform=3; }
message DeleteDeviceRequest { string user_id=1; string device_id=2; }
message DeviceResponse { Device device=1; }
message UpsertTemplateRequest { string event_type=1; Channel channel=2; string subject=3; string body=4; bool active=5; }
message TemplateResponse { Template template=1; }
message ListTemplatesRequest { optional string event_type=1; optional Channel channel=2; int32 limit=3; int32 offset=4; }
message ListTemplatesResponse { repeated Template templates=1; int64 total=2; }
message ListDeliveriesRequest { optional DeliveryStatus status=1; optional Channel channel=2; int32 limit=3; int32 offset=4; }
message ListDeliveriesResponse { repeated Delivery deliveries=1; int64 total=2; }
