syntax = "proto3";
package analytics.v1;
option go_package = "github.com/FIZZI-77/automatic-system-contracts/gen/go/analytics/v1";

import "google/protobuf/timestamp.proto";

service AnalyticsService {
  rpc GetTicketOverview(GetTicketOverviewRequest) returns (GetTicketOverviewResponse);
  rpc GetSLASummary(GetSLASummaryRequest) returns (GetSLASummaryResponse);
  rpc ListTicketBreakdown(ListTicketBreakdownRequest) returns (ListTicketBreakdownResponse);
  rpc ListDailyTicketMetrics(ListDailyTicketMetricsRequest) returns (ListDailyTicketMetricsResponse);
  rpc GetAssetSummary(GetAssetSummaryRequest) returns (GetAssetSummaryResponse);
  rpc GetOperationalLatency(GetOperationalLatencyRequest) returns (GetOperationalLatencyResponse);
  rpc GetDispatchFailureSummary(GetDispatchFailureSummaryRequest) returns (GetDispatchFailureSummaryResponse);
  rpc GetBrigadeWorkload(GetBrigadeWorkloadRequest) returns (GetBrigadeWorkloadResponse);
  rpc GetActiveWorkers(GetActiveWorkersRequest) returns (GetActiveWorkersResponse);
  rpc GetAssignmentFunnel(GetAssignmentFunnelRequest) returns (GetAssignmentFunnelResponse);
  rpc GetDispatchEffectiveness(GetDispatchEffectivenessRequest) returns (GetDispatchEffectivenessResponse);
  rpc GetOperationalInsights(GetOperationalInsightsRequest) returns (GetOperationalInsightsResponse);
  rpc GetProjectionHealth(GetProjectionHealthRequest) returns (GetProjectionHealthResponse);
  rpc ListDispatchOperations(ListDispatchOperationsRequest) returns (ListDispatchOperationsResponse);
  rpc GetBrigadePerformance(GetBrigadePerformanceRequest) returns (GetBrigadePerformanceResponse);
  rpc GetDepartmentPerformance(GetDepartmentPerformanceRequest) returns (GetDepartmentPerformanceResponse);
}

message AnalyticsFilter {
  optional google.protobuf.Timestamp from = 1;
  optional google.protobuf.Timestamp to = 2;
  optional string department_id = 3;
  optional string category_id = 4;
  optional string priority = 5;
  optional string brigade_id = 6;
  optional string assignment_mode = 7;
  optional string failure_code = 8;
  optional bool success = 9;
}
message GetTicketOverviewRequest { AnalyticsFilter filter = 1; }
message GetTicketOverviewResponse {
  uint64 created = 1;
  uint64 completed = 2;
  uint64 canceled = 3;
  uint64 active = 4;
  double completion_rate = 5;
  double avg_response_seconds = 6;
  double avg_resolution_seconds = 7;
}
message GetSLASummaryRequest { AnalyticsFilter filter = 1; }
message GetSLASummaryResponse {
  uint64 response_warnings = 1;
  uint64 response_breaches = 2;
  uint64 resolution_warnings = 3;
  uint64 resolution_breaches = 4;
  uint64 completed = 5;
  double breach_rate = 6;
}
enum BreakdownDimension {
  BREAKDOWN_DIMENSION_UNSPECIFIED = 0;
  BREAKDOWN_DIMENSION_DEPARTMENT = 1;
  BREAKDOWN_DIMENSION_CATEGORY = 2;
  BREAKDOWN_DIMENSION_PRIORITY = 3;
  BREAKDOWN_DIMENSION_STATUS = 4;
}
message ListTicketBreakdownRequest { AnalyticsFilter filter = 1; BreakdownDimension dimension = 2; int32 limit = 3; }
message TicketBreakdown { string key = 1; uint64 count = 2; double percent = 3; }
message ListTicketBreakdownResponse { repeated TicketBreakdown items = 1; uint64 total = 2; }
message ListDailyTicketMetricsRequest { AnalyticsFilter filter = 1; }
message DailyTicketMetric { google.protobuf.Timestamp day = 1; uint64 created = 2; uint64 completed = 3; uint64 canceled = 4; uint64 sla_breaches = 5; }
message ListDailyTicketMetricsResponse { repeated DailyTicketMetric items = 1; }
message GetAssetSummaryRequest { AnalyticsFilter filter = 1; optional string asset_type = 2; optional string district = 3; }
message AssetBreakdown { string key = 1; uint64 incidents = 2; uint64 repeated_incidents = 3; uint64 repairs = 4; uint64 critical_risk_updates = 5; }
message GetAssetSummaryResponse { uint64 assets_created = 1; uint64 incidents = 2; uint64 repeated_incidents = 3; uint64 repairs = 4; uint64 inspections = 5; uint64 critical_risk_updates = 6; repeated AssetBreakdown by_type = 7; repeated AssetBreakdown by_district = 8; }

enum OperationalLatencyDimension {
  OPERATIONAL_LATENCY_DIMENSION_UNSPECIFIED = 0;
  OPERATIONAL_LATENCY_DIMENSION_DEPARTMENT = 1;
  OPERATIONAL_LATENCY_DIMENSION_CATEGORY = 2;
  OPERATIONAL_LATENCY_DIMENSION_PRIORITY = 3;
  OPERATIONAL_LATENCY_DIMENSION_ASSIGNMENT_MODE = 4;
  OPERATIONAL_LATENCY_DIMENSION_BRIGADE = 5;
  OPERATIONAL_LATENCY_DIMENSION_ENGINE = 6;
  OPERATIONAL_LATENCY_DIMENSION_TRAVEL_MODE = 7;
  OPERATIONAL_LATENCY_DIMENSION_SUCCESS = 8;
  OPERATIONAL_LATENCY_DIMENSION_FAILURE_CODE = 9;
}
message GetOperationalLatencyRequest {
  AnalyticsFilter filter = 1;
  OperationalLatencyDimension group_by = 2;
}
message LatencyDistribution {
  uint64 sample_count = 1;
  double average_seconds = 2;
  double median_seconds = 3;
  double p90_seconds = 4;
  double p95_seconds = 5;
  double p99_seconds = 6;
}
message GetOperationalLatencyResponse {
  LatencyDistribution assignment_time = 1;
  LatencyDistribution routing_calculation_time = 2;
  repeated OperationalLatencyGroup groups = 3;
}
message OperationalLatencyGroup {
  string dimension = 1;
  string key = 2;
  LatencyDistribution assignment_time = 3;
  LatencyDistribution routing_calculation_time = 4;
}

message GetDispatchFailureSummaryRequest { AnalyticsFilter filter = 1; }
message DispatchFailureBreakdown {
  string key = 1;
  uint64 count = 2;
  double percent = 3;
}
message DispatchFailureReasonSummary {
  string reason = 1;
  uint64 count = 2;
  double request_rate = 3;
}
message DispatchFailureReasonDimension {
  string reason = 1;
  string key = 2;
  uint64 count = 3;
  double reason_percent = 4;
}
message GetDispatchFailureSummaryResponse {
  uint64 requested = 1;
  uint64 failed = 2;
  uint64 expired = 3;
  uint64 canceled = 4;
  double failure_rate = 5;
  repeated DispatchFailureBreakdown by_stage = 6;
  repeated DispatchFailureBreakdown by_code = 7;
  repeated DispatchFailureReasonSummary business_reasons = 8;
  repeated DispatchFailureReasonDimension reasons_by_department = 9;
  repeated DispatchFailureReasonDimension reasons_by_category = 10;
}

message GetBrigadeWorkloadRequest { AnalyticsFilter filter = 1; }
message BrigadeWorkloadItem {
  string brigade_id = 1;
  uint64 incoming = 2;
  uint64 assigned = 3;
  uint64 completed = 4;
  uint64 active = 5;
}
message GetBrigadeWorkloadResponse {
  uint64 incoming = 1;
  uint64 assigned = 2;
  uint64 completed = 3;
  uint64 active = 4;
  uint64 unassigned_backlog = 5;
  repeated BrigadeWorkloadItem brigades = 6;
  uint64 brigade_count = 7;
  uint64 max_active = 8;
  double average_active = 9;
  double standard_deviation = 10;
  double coefficient_of_variation = 11;
  double gini = 12;
}

message GetActiveWorkersRequest { AnalyticsFilter filter = 1; }
message ActiveWorkerGroup {
  string dimension = 1;
  string key = 2;
  uint64 active_members = 3;
  uint64 available = 4;
  uint64 on_shift = 5;
}
message GetActiveWorkersResponse {
  uint64 active_members = 1;
  uint64 available = 2;
  repeated ActiveWorkerGroup by_department = 3;
  repeated ActiveWorkerGroup by_brigade = 4;
  uint64 on_shift = 5;
}

message GetAssignmentFunnelRequest { AnalyticsFilter filter = 1; }
message AssignmentFunnelStage {
  string stage = 1;
  uint64 count = 2;
  double conversion_from_previous = 3;
  LatencyDistribution transition_time = 4;
}
message GetAssignmentFunnelResponse {
  repeated AssignmentFunnelStage stages = 1;
}

message GetDispatchEffectivenessRequest { AnalyticsFilter filter = 1; }
message DispatchModeEffectiveness {
  string mode = 1;
  uint64 requested = 2;
  uint64 assigned = 3;
  double success_rate = 4;
  LatencyDistribution assignment_time = 5;
}
message GetDispatchEffectivenessResponse {
  DispatchModeEffectiveness automatic = 1;
  DispatchModeEffectiveness manual = 2;
  bool manual_reassignment_available = 3;
}

message GetOperationalInsightsRequest { AnalyticsFilter filter = 1; }
message QueueAgeBucket {
  string range = 1;
  uint64 count = 2;
}
message QueueAgeSummary {
  uint64 active_unassigned = 1;
  LatencyDistribution age = 2;
  repeated QueueAgeBucket buckets = 3;
}
message RoutingEfficiency {
  uint64 routes = 1;
  uint64 recalculations = 2;
  uint64 cancellations = 3;
  double unreachable_candidate_rate = 4;
  double average_distance_km = 5;
  double kilometers_per_completed_ticket = 6;
  uint64 eta_sample_count = 7;
  double eta_mean_absolute_error_seconds = 8;
  double eta_bias_seconds = 9;
  double eta_p95_absolute_error_seconds = 10;
  double eta_within_five_minutes_rate = 11;
}
message CapacityForecast {
  uint32 observed_days = 1;
  double average_daily_incoming = 2;
  double forecast_next_day = 3;
  double peak_hourly_incoming = 4;
  uint64 required_brigades = 5;
  string formula = 6;
}
message GetOperationalInsightsResponse {
  LatencyDistribution departure_time = 1;
  QueueAgeSummary queue_age = 2;
  RoutingEfficiency routing = 3;
  CapacityForecast capacity_forecast = 4;
}
message GetProjectionHealthRequest {}
message ProjectionTopicHealth {
  string topic = 1;
  uint64 total_events = 2;
  uint64 unknown_version_events = 3;
  double projection_eligible_rate = 4;
  google.protobuf.Timestamp last_occurred_at = 5;
  google.protobuf.Timestamp last_ingested_at = 6;
  double freshness_seconds = 7;
  double ingestion_p95_seconds = 8;
}
message GetProjectionHealthResponse {
  uint64 total_events = 1;
  uint64 unknown_version_events = 2;
  double projection_eligible_rate = 3;
  google.protobuf.Timestamp last_occurred_at = 4;
  google.protobuf.Timestamp last_ingested_at = 5;
  double freshness_seconds = 6;
  double ingestion_p95_seconds = 7;
  repeated ProjectionTopicHealth topics = 8;
  uint64 projected_events = 9;
  uint64 missing_projection_events = 10;
  double projection_error_rate = 11;
}
message ListDispatchOperationsRequest {
  AnalyticsFilter filter = 1;
  uint32 limit = 2;
}
message DispatchOperationItem {
  string operation_id = 1;
  string ticket_id = 2;
  string department_id = 3;
  string category_id = 4;
  string brigade_id = 5;
  string assignment_mode = 6;
  string status = 7;
  string failure_code = 8;
  string failure_stage = 9;
  string trace_id = 10;
  google.protobuf.Timestamp requested_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
message ListDispatchOperationsResponse {
  repeated DispatchOperationItem items = 1;
}
message GetBrigadePerformanceRequest { AnalyticsFilter filter = 1; }
message BrigadePerformanceItem {
  string brigade_id = 1;
  uint64 completed = 2;
  LatencyDistribution execution_time = 3;
  uint64 sla_breaches = 4;
  double sla_breach_rate = 5;
  uint64 repeated_asset_tickets = 6;
  uint64 shift_count = 7;
  double shift_hours = 8;
  double completed_per_shift = 9;
  double utilization_rate = 10;
  double busy_hours = 11;
  double average_parallel_tasks = 12;
}
message GetBrigadePerformanceResponse {
  uint64 completed = 1;
  LatencyDistribution execution_time = 2;
  uint64 sla_breaches = 3;
  double sla_breach_rate = 4;
  uint64 repeated_asset_tickets = 5;
  bool shift_metrics_available = 6;
  repeated BrigadePerformanceItem brigades = 7;
  uint64 shift_count = 8;
  double shift_hours = 9;
  double completed_per_shift = 10;
  double utilization_rate = 11;
  double busy_hours = 12;
  double average_parallel_tasks = 13;
}

message GetDepartmentPerformanceRequest { AnalyticsFilter filter = 1; }
message DepartmentPerformance {
  string department_id = 1;
  uint64 created = 2;
  uint64 completed = 3;
  uint64 canceled = 4;
  uint64 active = 5;
  double completion_rate = 6;
  double average_response_seconds = 7;
  double average_resolution_seconds = 8;
  uint64 response_sla_sample_count = 9;
  uint64 response_sla_breaches = 10;
  double average_response_sla_deviation_seconds = 11;
  uint64 resolution_sla_sample_count = 12;
  uint64 resolution_sla_breaches = 13;
  double average_resolution_sla_deviation_seconds = 14;
  uint64 feedback_count = 15;
  double average_rating = 16;
  double positive_rating_rate = 17;
  double resolved_feedback_rate = 18;
  double feedback_response_rate = 19;
  uint64 response_sample_count = 20;
  uint64 resolution_sample_count = 21;
}
message GetDepartmentPerformanceResponse {
  repeated DepartmentPerformance departments = 1;
  DepartmentPerformance organization = 2;
}
