syntax = "proto3";
package analytics.v1;
option go_package = "github.com/FIZZI-77/automatic-system-contracts/gen/go/analytics/v1";

import "google/protobuf/timestamp.proto";

service AnalyticsService {
  rpc GetTicketOverview(GetTicketOverviewRequest) returns (GetTicketOverviewResponse);
  rpc GetSLASummary(GetSLASummaryRequest) returns (GetSLASummaryResponse);
  rpc ListTicketBreakdown(ListTicketBreakdownRequest) returns (ListTicketBreakdownResponse);
  rpc ListDailyTicketMetrics(ListDailyTicketMetricsRequest) returns (ListDailyTicketMetricsResponse);
  rpc GetAssetSummary(GetAssetSummaryRequest) returns (GetAssetSummaryResponse);
  rpc GetOperationalLatency(GetOperationalLatencyRequest) returns (GetOperationalLatencyResponse);
  rpc GetDispatchFailureSummary(GetDispatchFailureSummaryRequest) returns (GetDispatchFailureSummaryResponse);
  rpc GetBrigadeWorkload(GetBrigadeWorkloadRequest) returns (GetBrigadeWorkloadResponse);
  rpc GetActiveWorkers(GetActiveWorkersRequest) returns (GetActiveWorkersResponse);
  rpc GetAssignmentFunnel(GetAssignmentFunnelRequest) returns (GetAssignmentFunnelResponse);
}

message AnalyticsFilter {
  optional google.protobuf.Timestamp from = 1;
  optional google.protobuf.Timestamp to = 2;
  optional string department_id = 3;
  optional string category_id = 4;
  optional string priority = 5;
  optional string brigade_id = 6;
  optional string assignment_mode = 7;
  optional string failure_code = 8;
  optional bool success = 9;
}
message GetTicketOverviewRequest { AnalyticsFilter filter = 1; }
message GetTicketOverviewResponse {
  uint64 created = 1;
  uint64 completed = 2;
  uint64 canceled = 3;
  uint64 active = 4;
  double completion_rate = 5;
  double avg_response_seconds = 6;
  double avg_resolution_seconds = 7;
}
message GetSLASummaryRequest { AnalyticsFilter filter = 1; }
message GetSLASummaryResponse {
  uint64 response_warnings = 1;
  uint64 response_breaches = 2;
  uint64 resolution_warnings = 3;
  uint64 resolution_breaches = 4;
  uint64 completed = 5;
  double breach_rate = 6;
}
enum BreakdownDimension {
  BREAKDOWN_DIMENSION_UNSPECIFIED = 0;
  BREAKDOWN_DIMENSION_DEPARTMENT = 1;
  BREAKDOWN_DIMENSION_CATEGORY = 2;
  BREAKDOWN_DIMENSION_PRIORITY = 3;
  BREAKDOWN_DIMENSION_STATUS = 4;
}
message ListTicketBreakdownRequest { AnalyticsFilter filter = 1; BreakdownDimension dimension = 2; int32 limit = 3; }
message TicketBreakdown { string key = 1; uint64 count = 2; double percent = 3; }
message ListTicketBreakdownResponse { repeated TicketBreakdown items = 1; uint64 total = 2; }
message ListDailyTicketMetricsRequest { AnalyticsFilter filter = 1; }
message DailyTicketMetric { google.protobuf.Timestamp day = 1; uint64 created = 2; uint64 completed = 3; uint64 canceled = 4; uint64 sla_breaches = 5; }
message ListDailyTicketMetricsResponse { repeated DailyTicketMetric items = 1; }
message GetAssetSummaryRequest { AnalyticsFilter filter = 1; optional string asset_type = 2; optional string district = 3; }
message AssetBreakdown { string key = 1; uint64 incidents = 2; uint64 repeated_incidents = 3; uint64 repairs = 4; uint64 critical_risk_updates = 5; }
message GetAssetSummaryResponse { uint64 assets_created = 1; uint64 incidents = 2; uint64 repeated_incidents = 3; uint64 repairs = 4; uint64 inspections = 5; uint64 critical_risk_updates = 6; repeated AssetBreakdown by_type = 7; repeated AssetBreakdown by_district = 8; }

enum OperationalLatencyDimension {
  OPERATIONAL_LATENCY_DIMENSION_UNSPECIFIED = 0;
  OPERATIONAL_LATENCY_DIMENSION_DEPARTMENT = 1;
  OPERATIONAL_LATENCY_DIMENSION_CATEGORY = 2;
  OPERATIONAL_LATENCY_DIMENSION_PRIORITY = 3;
  OPERATIONAL_LATENCY_DIMENSION_ASSIGNMENT_MODE = 4;
  OPERATIONAL_LATENCY_DIMENSION_BRIGADE = 5;
  OPERATIONAL_LATENCY_DIMENSION_ENGINE = 6;
  OPERATIONAL_LATENCY_DIMENSION_TRAVEL_MODE = 7;
  OPERATIONAL_LATENCY_DIMENSION_SUCCESS = 8;
  OPERATIONAL_LATENCY_DIMENSION_FAILURE_CODE = 9;
}
message GetOperationalLatencyRequest {
  AnalyticsFilter filter = 1;
  OperationalLatencyDimension group_by = 2;
}
message LatencyDistribution {
  uint64 sample_count = 1;
  double average_seconds = 2;
  double median_seconds = 3;
  double p90_seconds = 4;
  double p95_seconds = 5;
  double p99_seconds = 6;
}
message GetOperationalLatencyResponse {
  LatencyDistribution assignment_time = 1;
  LatencyDistribution routing_calculation_time = 2;
  repeated OperationalLatencyGroup groups = 3;
}
message OperationalLatencyGroup {
  string dimension = 1;
  string key = 2;
  LatencyDistribution assignment_time = 3;
  LatencyDistribution routing_calculation_time = 4;
}

message GetDispatchFailureSummaryRequest { AnalyticsFilter filter = 1; }
message DispatchFailureBreakdown {
  string key = 1;
  uint64 count = 2;
  double percent = 3;
}
message GetDispatchFailureSummaryResponse {
  uint64 requested = 1;
  uint64 failed = 2;
  uint64 expired = 3;
  uint64 canceled = 4;
  double failure_rate = 5;
  repeated DispatchFailureBreakdown by_stage = 6;
  repeated DispatchFailureBreakdown by_code = 7;
}

message GetBrigadeWorkloadRequest { AnalyticsFilter filter = 1; }
message BrigadeWorkloadItem {
  string brigade_id = 1;
  uint64 incoming = 2;
  uint64 assigned = 3;
  uint64 completed = 4;
  uint64 active = 5;
}
message GetBrigadeWorkloadResponse {
  uint64 incoming = 1;
  uint64 assigned = 2;
  uint64 completed = 3;
  uint64 active = 4;
  uint64 unassigned_backlog = 5;
  repeated BrigadeWorkloadItem brigades = 6;
}

message GetActiveWorkersRequest { AnalyticsFilter filter = 1; }
message ActiveWorkerGroup {
  string dimension = 1;
  string key = 2;
  uint64 active_members = 3;
  uint64 available = 4;
}
message GetActiveWorkersResponse {
  uint64 active_members = 1;
  uint64 available = 2;
  repeated ActiveWorkerGroup by_department = 3;
  repeated ActiveWorkerGroup by_brigade = 4;
}

message GetAssignmentFunnelRequest { AnalyticsFilter filter = 1; }
message AssignmentFunnelStage {
  string stage = 1;
  uint64 count = 2;
  double conversion_from_previous = 3;
  LatencyDistribution transition_time = 4;
}
message GetAssignmentFunnelResponse {
  repeated AssignmentFunnelStage stages = 1;
}
